version: "3.9"

services:
  ai-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - WRITING_MODEL_NAME=Onjeom/writing-ai
      - WRITING_MAX_SEQ_LENGTH=1536
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
